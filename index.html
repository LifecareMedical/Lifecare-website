<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مركز لايف كير الطبي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<style>
/* VOICE occasion: a trusted neighbourhood medical centre, warm and calm
   IDEA the centre's own heart-and-pulse emblem; one teal pulse line threads the page
   PICTURE hero heart traced by an ECG line cradling the logo, beside a live "today at the centre" card
   COLOUR white ground, deep teal #0e5a64 bands, lime #8fae2e support, brand maroon #9b2335 accent
   TYPE Tajawal 800 display + Tajawal text, Montserrat for the Latin wordmark
   LAYOUT laptop: title and actions on the right, heart picture and today card on the left; phone: title, heart, today, actions */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#071c21);--ink:light-dark(#0f2a30,#e6f1f2);--soft:light-dark(#4d6a70,#9fb9bd);
--teal:#0e5a64;--teal2:light-dark(#2e8090,#5cbac4);--lime:light-dark(#7d9a22,#a8c74a);--maroon:light-dark(#9b2335,#e0707f);
--tint:light-dark(#eef6f6,#0d2a30);--line:light-dark(#d5e5e6,#1d4148);--card:light-dark(#ffffff,#0b252b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 Tajawal,"Segoe UI",Tahoma,sans-serif;overflow-x:clip}
img{max-width:100%;display:block}
a{color:inherit}
.band{padding-block:clamp(40px,6vw,88px);padding-inline:max(5vw,16px)}
.wrap{max-width:1240px;margin-inline:auto}
h1,h2,h3{line-height:1.15;letter-spacing:-.01em;margin:0}
h2{font-size:clamp(30px,4vw,44px);font-weight:800}
.lead{color:var(--soft);font-size:18px;max-width:62ch;margin:12px 0 0}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 24px;border-radius:999px;font:700 17px Tajawal,sans-serif;text-decoration:none;border:0;cursor:pointer;white-space:nowrap}
.btn.main{background:var(--lime);color:#fff}
.btn.main:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 2px currentColor}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.day:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
/* header */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:20px;padding:10px max(5vw,16px);max-width:1340px;margin-inline:auto}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand img{width:46px;height:46px;border-radius:50%;background:#fff;padding:3px;box-shadow:0 0 0 1px var(--line)}
.brand b{font-size:19px;font-weight:800;display:block;line-height:1.1}
.brand small{font:800 10.5px Montserrat,sans-serif;letter-spacing:.12em;color:var(--teal2)}
nav{display:flex;gap:22px;margin-inline-start:auto;font-weight:700;font-size:16px}
nav a{text-decoration:none;color:var(--soft)}
nav a:hover{color:var(--ink)}
.bar .btn{min-height:42px;padding:0 18px;font-size:16px}
/* hero */
.hero{background:var(--teal);color:#fff;position:relative;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:center}
.hero h1{font-size:clamp(42px,6vw,72px);font-weight:800}
.hero .tag{color:#cfe39a;font-weight:700;font-size:20px;margin-top:10px}
.hero p{color:#d6ebed;font-size:19px;max-width:44ch;margin:18px 0 26px}
.acts{display:flex;flex-wrap:wrap;gap:12px}
.hero .btn.main{background:#a5c23f;color:#0b3a40}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;margin-top:34px;background:rgba(255,255,255,.18);border-radius:16px;overflow:hidden}
.facts div{background:#0f6570;padding:14px 12px}
.facts b{display:block;font-size:24px;font-weight:800;white-space:nowrap}
.facts span{font-size:14px;color:#cfe3e5}
.pic{position:relative;display:grid;gap:16px}
.heart{width:100%;max-width:560px;margin-inline:auto;aspect-ratio:600/470}
.heart svg{width:100%;height:100%;overflow:visible}
.pulse{fill:none;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:no-preference){.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.4s .2s cubic-bezier(.6,0,.2,1) forwards}@keyframes draw{to{stroke-dashoffset:0}}}
.today{background:#fff;color:#0f2a30;border-radius:20px;padding:18px 20px;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.today h3{font-size:19px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.today h3 small{font-weight:500;color:#5b7479;font-size:14px}
.today ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.today li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-size:15.5px}
.today li i{width:10px;height:10px;border-radius:50%;background:#8fae2e}
.today li.on i{background:#2e8090;box-shadow:0 0 0 4px rgba(46,128,144,.18)}
.today li em{font-style:normal;color:#5b7479;white-space:nowrap;font-size:14.5px}
/* services */
.svc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-top:34px}
.s{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.s .ph{aspect-ratio:4/3;background:var(--tint);overflow:hidden}
.s .ph img{width:100%;height:100%;object-fit:cover}
.s .ic{aspect-ratio:4/3;display:grid;place-items:center;background:var(--tint)}
.s .ic svg{width:44%;height:auto;color:var(--teal2)}
.s div.t{padding:16px 18px 20px}
.s h3{font-size:20px;font-weight:800}
.s p{margin:6px 0 0;color:var(--soft);font-size:15.5px;line-height:1.55}
.s .when{display:inline-block;margin-top:10px;font-size:14px;font-weight:700;color:var(--teal2)}
/* doctors */
.docs{background:var(--tint)}
.dg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-top:34px}
.d{background:var(--card);border-radius:22px;padding:22px 18px 18px;text-align:center;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center}
.d img{width:118px;height:118px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 4px var(--card),0 0 0 6px var(--teal2)}
.d h3{font-size:19px;margin-top:16px;font-weight:800}
.d .sp{color:var(--lime);font-weight:700;font-size:15px;margin-top:4px;min-height:2.6em}
.d ul{list-style:none;padding:0;margin:10px 0 14px;font-size:14.5px;color:var(--soft);display:grid;gap:2px}
.d ul b{color:var(--ink)}
.d .av{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--teal2);font-size:34px;font-weight:800;box-shadow:0 0 0 4px var(--card),0 0 0 6px var(--teal2)}
.d ul .n{white-space:nowrap;display:inline-block}
.d .btn{margin-top:auto;min-height:42px;font-size:15.5px;background:var(--teal);color:#fff;width:100%;justify-content:center}
/* schedule */
.days{display:flex;flex-wrap:wrap;gap:8px;margin-top:28px}
.day{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;min-height:44px;padding:0 18px;font:700 16px Tajawal,sans-serif;cursor:pointer}
.day[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:#fff}
.day .now{font-size:12px;color:var(--lime);margin-inline-start:6px}
.day[aria-pressed=true] .now{color:#cfe39a}
.slots{margin-top:20px;display:grid;gap:0;border-top:2px solid var(--ink)}
.slot{display:grid;grid-template-columns:minmax(9em,auto) minmax(0,1fr) auto;gap:18px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line)}
.slot .tm{font-weight:800;font-size:20px;white-space:nowrap;color:var(--teal2)}
.slot b{display:block;font-size:18px}
.slot span{color:var(--soft);font-size:15px}
.slot a{font-weight:700;font-size:15px;color:var(--lime);white-space:nowrap}
.d .notes{width:100%;display:grid;gap:6px;margin:-4px 0 14px}
.d .notes p{margin:0;font-size:13.5px;line-height:1.45;border-radius:10px;padding:7px 10px;background:var(--tint);color:var(--ink)}
.d .notes p.cancel{background:light-dark(#fdeef0,#3a1a20);color:var(--maroon);font-weight:700}
.tag{font-style:normal;font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 9px;margin-inline-start:6px;background:var(--tint);color:var(--teal2);white-space:nowrap}
.tag.cancel{background:light-dark(#fdeef0,#3a1a20);color:var(--maroon)}
.tag.extra{background:light-dark(#f1f6e4,#26310f);color:var(--lime)}
.slot.off .tm,.slot.off b{text-decoration:line-through;opacity:.55}
.slot.off .tag{text-decoration:none;display:inline-block}
.today li.off span,.today li.off em{color:#9b2335}
.day small{font-weight:500;opacity:.75;font-size:13px}
/* booking */
.book{background:var(--teal);color:#fff}
.book .wrap{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(24px,5vw,64px);align-items:start}
.book .lead{color:#cfe3e5}
.steps{list-style:none;padding:0;margin:26px 0 0;display:grid;gap:14px}
.steps li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:start;color:#e2f0f1}
.steps li b{width:40px;height:40px;border-radius:50%;background:#a5c23f;color:#0b3a40;display:grid;place-items:center;font-size:18px}
form,.done{background:var(--card);color:var(--ink);border-radius:24px;padding:clamp(20px,3vw,32px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
label{display:grid;gap:6px;font-weight:700;font-size:15px}
label.full{grid-column:1/-1}
input,select,textarea{font:16px Tajawal,sans-serif;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px;width:100%}
textarea{min-height:90px;resize:vertical}
.hint{grid-column:1/-1;font-size:14.5px;border-radius:12px;padding:10px 14px;background:var(--tint);color:var(--soft);margin:0}
.hint.warn{background:light-dark(#fdeef0,#3a1a20);color:var(--maroon)}
form .btn{grid-column:1/-1;justify-content:center;background:var(--lime);color:#fff;font-size:18px}
.err{color:var(--maroon);font-size:13.5px;font-weight:500;min-height:1em}
.done{grid-template-columns:minmax(0,1fr)}
.done pre{white-space:pre-wrap;overflow-wrap:anywhere;font:15px/1.7 Tajawal,sans-serif;background:var(--tint);border-radius:14px;padding:14px 16px;margin:0}
.done .acts .btn.main{background:#25a35a}
/* contact */
.contact .wrap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:30px}
.c{border:1px solid var(--line);border-radius:20px;padding:22px}
.c h3{font-size:18px;color:var(--teal2)}
.c p{margin:8px 0 0;font-size:17px}
.c .big{font:800 26px Montserrat,sans-serif;direction:ltr;text-align:right;white-space:nowrap;color:var(--ink)}
footer{background:#06343b;color:#cfe3e5;padding:30px max(5vw,16px);font-size:15px}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 32px;justify-content:space-between;align-items:center}
footer b{color:#fff}
.mbar{display:none}
@media(max-width:1020px){.svc,.dg{grid-template-columns:repeat(2,minmax(0,1fr))}nav{display:none}.bar .btn{margin-inline-start:auto}}
@media(max-width:860px){.hero .wrap,.book .wrap{grid-template-columns:minmax(0,1fr)}.contact .wrap{grid-template-columns:minmax(0,1fr)}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){body{font-size:16px}.svc{grid-template-columns:minmax(0,1fr)}.dg{gap:12px}.d{padding:16px 10px 12px}.d img{width:92px;height:92px}.d h3{font-size:17px}.d .sp{font-size:14px}.slot{grid-template-columns:minmax(0,1fr) auto}.slot .tm{grid-column:1/-1;font-size:18px}form{grid-template-columns:minmax(0,1fr)}.brand small{display:none}.bar .btn{display:none}
.mbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:fixed;inset:auto 0 0 0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:30}.mbar .btn{justify-content:center;padding:0 10px}body{padding-bottom:72px}}
</style>
</head>
